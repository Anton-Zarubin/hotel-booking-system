spring:
  application:
    name: gateway
  profiles:
    active: local
  cloud:
    config:
      uri: ${CONFIG_URI:http://localhost:8761}
      fail-fast: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true

springdoc:
  swagger-ui:
    use-root-path: true
    urls:
      - name: auth
        url: /auth-service/v3/api-docs
      - name: booking
        url: /booking-service/v3/api-docs
      - name: hotel
        url: /hotel-service/v3/api-docs
      - name: payment
        url: /payment-service/v3/api-docs